<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ホネツギ</title>
<meta name="description" content="骨をつないで、自動で殴りあう。勝つと相手の骨をもらえる。3戦ごとにボスが出る。あなたは何連勝できる？">
<meta name="theme-color" content="#17132b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap" rel="stylesheet">
<style>
:root { --page-bg: #17132b; --page-fg: #fbf7ec; }
html, body { margin: 0; height: 100%; background: var(--page-bg); color: var(--page-fg); overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
#app { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
canvas { display: block; touch-action: none; outline: none; }
</style>
</head>
<body>
<div id="app"><canvas id="c" aria-label="ホネツギ（ゲーム画面）" role="img"></canvas></div>
<script>
'use strict';
/* ============================================================
   バトルの中身（物理・当たり判定・ダメージ）。画面がなくても動く。
   座標は 横360 の画面と同じ。y は下向きがプラス。
   ============================================================ */
const SIM = (() => {
  /* ---------- 設定（ここを書き換えると調整できます） ---------- */
  const GY = 430;                 // 地面の高さ
  const XL = 14, XR = 346;        // 左右の壁
  const HOV = 96;                 // ドクロが浮く高さ（地面から）。背骨の先（腰）にあし骨をつなぐと、少し開いても地面に届く高さ
  const GRAV = 900;               // 重力
  const SUB = 2, ITER = 4;        // 1コマを何回に分けて計算するか／骨の長さを保つ計算の回数
  const DT = 1 / 60 / SUB;
  const SKULL_R = 15, SKULL_M = 4;
  const HOVER_K = 60, HOVER_C = 12;   // 浮く力のばね・ブレーキ
  const DRIVE = 110, DRIVE_FOOT = 170, DRIVE_C = 3;   // 相手へ向かう力（足が地面につくと速くなる）
  const TIME_LIMIT = 30;          // 1試合の長さ（秒）。時間切れは体力の割合で決める
  const IFRAME = 0.3;             // ドクロが続けてダメージを受けない時間（秒）
  const RAGE_FROM = 7, RAGE_STEP = 4, RAGE_MAX = 5;   // 長引くと ダメージが増えていく（7秒から、4秒ごとに＋1倍、最大＋5倍）
  const MAX_BONES = 12;           // つなげる骨の本数の上限（下の背骨は数えない）
  const BASE = ['S', -1, 90];     // 全員が最初から持っている背骨。ドクロの真下に固定で、外せない・折れない

  /* 骨の種類
     L=長さ r=太さ m=重さ amp=振る大きさ(ラジアン) w=振る速さ k=関節の強さ
     atk=ドクロに当てた時のダメージ dur=折れにくさ brk=相手の骨を折る力 */
  const TYPES = {
    A: { name: 'うで骨', desc: 'ブンブン振って殴る。まずはこれ', L: 46, r: 4, m: 1.0, amp: 1.1, w: 7.0, k: 0.22, atk: 9, dur: 40, brk: 8 },
    L: { name: 'あし骨', desc: '地面につくと速く進み、押し負けにくい', L: 56, r: 5, m: 1.4, amp: 0.45, w: 6.0, k: 0.30, atk: 5, dur: 60, brk: 8, foot: true },
    S: { name: 'せぼね', desc: 'ほとんど動かない。体をのばす土台', L: 38, r: 5, m: 1.2, amp: 0.08, w: 3.0, k: 0.40, atk: 3, dur: 70, brk: 6 },
    R: { name: 'あばら', desc: '太くて折れにくい盾。ドクロを守る', L: 32, r: 8, m: 1.6, amp: 0.05, w: 3.0, k: 0.45, atk: 2, dur: 90, brk: 10 },
    H: { name: 'ツノ', desc: '短いが、当たると大ダメージ', L: 26, r: 3.5, m: 0.6, amp: 0.0, w: 1.0, k: 0.50, atk: 16, dur: 45, brk: 14, pierce: true },
    T: { name: 'しっぽ骨', desc: '長くて軽いムチ。遠くまで届くが折れやすい', L: 64, r: 3, m: 0.7, amp: 1.4, w: 9.0, k: 0.10, atk: 7, dur: 25, brk: 5 },
    C: { name: 'こんぼう骨', desc: '重くて遅いが、一発が大きい', L: 58, r: 7, m: 2.6, amp: 0.9, w: 4.2, k: 0.16, atk: 15, dur: 90, brk: 18 },
  };

  /* ---------- 小さな道具 ---------- */
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  /* ---------- 骨の体を作る ----------
     spec.bones = [[種類, 親(−1ならドクロ), 角度(度)], ...]   ※先頭（0番）は全員共通の背骨 BASE
     角度は「右向き」で作った時のもの。ドクロにつなぐ骨は 0=前 90=下 −90=上。
     骨につなぐ骨は、親の骨の向きから何度曲げるか。左向き（敵）は自動で左右反転する。
     spec.scale = 体の大きさ（ボス用。1.3 なら 1.3倍。長さ・太さ・浮く高さが大きくなり、重さは2乗、折れにくさも上がる） */
  function makeCreature(spec, dir, x0, hp, rnd) {
    const sc = spec.scale > 0 ? +spec.scale : 1;
    const c = { dir, hp, hpMax: hp, pw: 1, pts: [], bones: [], inv: 0, feet: 0, name: spec.name || '', mass: 0, flash: 0, sc, boss: !!spec.boss, skullR: SKULL_R * sc, hov: HOV * sc, sm: SKULL_M * sc * sc };
    c.pts.push({ x: x0, y: GY - c.hov, px: x0, py: GY - c.hov, m: c.sm, r: c.skullR });
    const list = (spec.bones || []).slice(0, MAX_BONES + 1);
    list.forEach(([ty, par, deg], i) => {
      const t = TYPES[ty]; if (!t) return;
      const base = i === 0 && ty === BASE[0] && par < 0 && deg === BASE[2];   // 体の芯の背骨
      if (par >= i) par = -1;
      const a = par < 0 ? 0 : c.bones[par].b;
      const relB = deg * Math.PI / 180, absB = (par < 0 ? 0 : c.bones[par].absB) + relB;
      const abs = dir > 0 ? absB : Math.PI - absB;
      const pa = c.pts[a], b = c.pts.length, L = t.L * sc, r = t.r * sc;
      const x = pa.x + Math.cos(abs) * L, y = pa.y + Math.sin(abs) * L;
      c.pts.push({ x, y, px: x, py: y, m: 0, r, foot: !!t.foot });
      c.bones.push({ ty, t, a, b, par, L, r, m: t.m * sc * sc, rel: par < 0 ? abs : (dir > 0 ? relB : -relB), absB, phase: i * 2.1 + rnd() * 0.8, dur: t.dur * sc, durMax: t.dur * sc, cd: 0, alive: true, sub: [b], k: t.k, base });
    });
    for (let i = c.bones.length - 1; i >= 0; i--) { const p = c.bones[i].par; if (p >= 0) c.bones[p].sub.push(...c.bones[i].sub); }
    c.bones.forEach(bn => { c.pts[bn.a].m += bn.m / 2; c.pts[bn.b].m += bn.m / 2; c.mass += bn.m; });
    c.bones.forEach(bn => { let load = 0; bn.sub.forEach(pi => { load += c.pts[pi].m; }); bn.k = bn.t.k / (1 + 0.22 * Math.max(0, load - bn.m) / (sc * sc)); });   // 先に重い物がぶら下がるほど、関節は弱くなる
    return c;
  }

  function makeWorld(specA, specB, opt) {
    opt = opt || {};
    const rnd = rng(opt.seed || 1);
    const w = { t: 0, clock: 0, active: false, over: null, ev: [], debris: [], rnd, limit: opt.limit || TIME_LIMIT };
    w.A = makeCreature(specA, 1, 92, opt.hpA || 100, rnd);
    w.B = makeCreature(specB, -1, 268, opt.hpB || 100, rnd); w.B.pw = opt.pwB || 1;   // pw＝相手の攻撃の強さ（1より小さいと手加減）
    for (let i = 0; i < 40; i++) stepWorld(w);     // 始まる前に姿勢を落ち着かせる
    w.ev.length = 0; w.t = 0;
    return w;
  }

  /* ---------- 1体ぶんの動き ---------- */
  function integrate(w, c, e) {
    const P = c.pts, s = P[0];
    // ドクロ：浮く＋相手へ向かう
    let vx = (s.x - s.px) / DT, vy = (s.y - s.py) / DT;
    const f = 1 + 0.5 * c.mass / c.sm;
    let ax = -DRIVE_C * vx, ay = (-HOVER_K * (s.y - (GY - c.hov)) - HOVER_C * vy) * f;
    if (w.active && !w.over) {
      const gap = Math.abs(e.pts[0].x - s.x), toward = Math.sign(e.pts[0].x - s.x) || c.dir;
      ax += toward * (DRIVE + DRIVE_FOOT * Math.min(2, c.feet)) * clamp((gap - (c.skullR + e.skullR + 2)) / 26, 0, 1);
    }
    if (c.hp <= 0) { ax = 0; ay = GRAV; }           // 負けたドクロは落ちる
    s.px = s.x; s.py = s.y; s.x += vx * DT + ax * DT * DT; s.y += vy * DT + ay * DT * DT;
    for (let i = 1; i < P.length; i++) {
      const p = P[i]; if (p.dead) continue;
      const dx = (p.x - p.px) * 0.995, dy = (p.y - p.py) * 0.995;
      p.px = p.x; p.py = p.y; p.x += dx; p.y += dy + GRAV * DT * DT;
    }
  }
  function muscles(w, c) {
    if (c.hp <= 0) return;
    const P = c.pts;
    for (const bn of c.bones) {
      if (!bn.alive) continue;
      const pa = P[bn.a], pb = P[bn.b];
      const cur = Math.atan2(pb.y - pa.y, pb.x - pa.x);
      let ref = 0;
      if (bn.par >= 0) { const q = c.bones[bn.par], qa = P[q.a], qb = P[q.b]; ref = Math.atan2(qb.y - qa.y, qb.x - qa.x); }
      const osc = c.dir * bn.t.amp * Math.sin(bn.t.w * w.clock + bn.phase) * (w.active ? 1 : 0.25);
      const st = clamp(wrap(ref + bn.rel + osc - cur) * bn.k, -0.2, 0.2);
      if (Math.abs(st) < 1e-5) continue;
      const cs = Math.cos(st), sn = Math.sin(st);
      for (const pi of bn.sub) { const p = P[pi]; if (p.dead) continue; const dx = p.x - pa.x, dy = p.y - pa.y; p.x = pa.x + dx * cs - dy * sn; p.y = pa.y + dx * sn + dy * cs; }
    }
  }
  function constraints(c) {
    const P = c.pts;
    for (let it = 0; it < ITER; it++) {
      for (const bn of c.bones) {
        if (!bn.alive) continue;
        const pa = P[bn.a], pb = P[bn.b];
        let dx = pb.x - pa.x, dy = pb.y - pa.y; const d = Math.hypot(dx, dy) || 1e-6, diff = (d - bn.L) / d;
        const wa = 1 / pa.m, wb = 1 / pb.m, sum = wa + wb;
        pa.x += dx * diff * wa / sum; pa.y += dy * diff * wa / sum; pb.x -= dx * diff * wb / sum; pb.y -= dy * diff * wb / sum;
      }
      bounds(c);
    }
  }
  function bounds(c) {
    const P = c.pts; let feet = 0;
    for (let i = 0; i < P.length; i++) {
      const p = P[i]; if (p.dead) continue;
      if (p.y > GY - p.r) { p.y = GY - p.r; const mu = p.foot ? 0.45 : 0.12; p.px = p.x - (p.x - p.px) * (1 - mu); if (p.foot) feet++; }
      if (p.x < XL + p.r) p.x = XL + p.r; else if (p.x > XR - p.r) p.x = XR - p.r;
    }
    c.feet = feet;
  }

  /* ---------- 当たり判定（骨＝太さのある線、ドクロ＝丸） ---------- */
  function closest(ax, ay, bx, by, cx, cy, dx, dy) {   // 線分 AB と線分 CD の、いちばん近い点
    const ux = bx - ax, uy = by - ay, vx = dx - cx, vy = dy - cy, wx = ax - cx, wy = ay - cy;
    const a = ux * ux + uy * uy, b = ux * vx + uy * vy, c = vx * vx + vy * vy, d = ux * wx + uy * wy, e = vx * wx + vy * wy, D = a * c - b * b;
    let sN, sD = D, tN, tD = D;
    if (D < 1e-9) { sN = 0; sD = 1; tN = e; tD = c; } else { sN = b * e - c * d; tN = a * e - b * d; if (sN < 0) { sN = 0; tN = e; tD = c; } else if (sN > sD) { sN = sD; tN = e + b; tD = c; } }
    if (tN < 0) { tN = 0; if (-d < 0) sN = 0; else if (-d > a) sN = sD; else { sN = -d; sD = a; } }
    else if (tN > tD) { tN = tD; if (-d + b < 0) sN = 0; else if (-d + b > a) sN = sD; else { sN = -d + b; sD = a; } }
    const s = Math.abs(sN) < 1e-9 || sD < 1e-9 ? 0 : sN / sD, t = Math.abs(tN) < 1e-9 || tD < 1e-9 ? 0 : tN / tD;
    return [s, t];
  }
  function sticks(c) {       // 当たり判定に使う「線」の一覧。ドクロは長さ0の線
    const out = [{ a: c.pts[0], b: c.pts[0], r: c.skullR, skull: true, bn: null }];
    for (const bn of c.bones) if (bn.alive) out.push({ a: c.pts[bn.a], b: c.pts[bn.b], r: bn.r, skull: false, bn });
    return out;
  }
  function breakBone(w, c, bn) {   // 骨が折れる：その先につながる骨ごと外れて落ちる
    const P = c.pts, idx = c.bones.indexOf(bn);
    const gone = c.bones.filter((q, i) => q.alive && (i === idx || bn.sub.indexOf(q.b) >= 0));
    for (const q of gone) {
      q.alive = false;
      const pa = P[q.a], pb = P[q.b], kick = 120 + w.rnd() * 160, ang = -Math.PI / 2 + (w.rnd() - 0.5) * 2.2;
      w.debris.push({ ty: q.ty, side: c.dir, sc: c.sc, x1: pa.x, y1: pa.y, x2: pb.x, y2: pb.y, vx: Math.cos(ang) * kick + (pb.x - pb.px) / DT * 0.4, vy: Math.sin(ang) * kick, w: (w.rnd() - 0.5) * 14, t: 0 });
      P[q.b].dead = true;
    }
    c.mass = 0; for (const q of c.bones) if (q.alive) c.mass += q.m;
    w.ev.push({ k: 'break', x: P[bn.a].x, y: P[bn.a].y, side: c.dir, n: gone.length });
  }
  function collide(w, A, B) {
    const SA = sticks(A), SB = sticks(B);
    for (const p of SA) for (const q of SB) {
      const [s, t] = p.skull ? [0, closestPt(p.a, q)] : q.skull ? [closestPt(q.a, p), 0] : closest(p.a.x, p.a.y, p.b.x, p.b.y, q.a.x, q.a.y, q.b.x, q.b.y);
      const px = p.a.x + (p.b.x - p.a.x) * s, py = p.a.y + (p.b.y - p.a.y) * s, qx = q.a.x + (q.b.x - q.a.x) * t, qy = q.a.y + (q.b.y - q.a.y) * t;
      let nx = px - qx, ny = py - qy; const d = Math.hypot(nx, ny), R = p.r + q.r;
      if (d >= R) continue;
      if (d < 1e-6) { nx = A.dir > 0 ? -1 : 1; ny = 0; } else { nx /= d; ny /= d; }
      // 近づく速さ
      const vpx = ((p.a.x - p.a.px) * (1 - s) + (p.b.x - p.b.px) * s) / DT, vpy = ((p.a.y - p.a.py) * (1 - s) + (p.b.y - p.b.py) * s) / DT;
      const vqx = ((q.a.x - q.a.px) * (1 - t) + (q.b.x - q.b.px) * t) / DT, vqy = ((q.a.y - q.a.py) * (1 - t) + (q.b.y - q.b.py) * t) / DT;
      const vn = -((vpx - vqx) * nx + (vpy - vqy) * ny);
      // 押し戻す（重い方が動きにくい）
      const wp = p.skull ? 1 / p.a.m : (1 - s) * (1 - s) / p.a.m + s * s / p.b.m, wq = q.skull ? 1 / q.a.m : (1 - t) * (1 - t) / q.a.m + t * t / q.b.m;
      const lam = Math.min(R - d, 4) / (wp + wq);
      if (p.skull) { p.a.x += nx * lam / p.a.m; p.a.y += ny * lam / p.a.m; } else { p.a.x += nx * lam * (1 - s) / p.a.m; p.a.y += ny * lam * (1 - s) / p.a.m; p.b.x += nx * lam * s / p.b.m; p.b.y += ny * lam * s / p.b.m; }
      if (q.skull) { q.a.x -= nx * lam / q.a.m; q.a.y -= ny * lam / q.a.m; } else { q.a.x -= nx * lam * (1 - t) / q.a.m; q.a.y -= ny * lam * (1 - t) / q.a.m; q.b.x -= nx * lam * t / q.b.m; q.b.y -= ny * lam * t / q.b.m; }
      if (!w.active || w.over) continue;
      const cx = (px + qx) / 2, cy = (py + qy) / 2;
      if (p.skull && q.skull) {                       // 頭突き：おたがい少しだけ痛い
        if (vn > 60 && A.inv <= 0 && B.inv <= 0) { hurt(w, A, 4, cx, cy, nx, ny); hurt(w, B, 4, cx, cy, -nx, -ny); }
      } else if (p.skull) strike(w, A, B, q.bn, vn, t, cx, cy, nx, ny);
      else if (q.skull) strike(w, B, A, p.bn, vn, s, cx, cy, -nx, -ny);
      else if (vn > 120 && p.bn.cd <= 0 && q.bn.cd <= 0) {   // 骨どうし：おたがい少しずつ傷む
        const k = clamp(vn / 300, 0.3, 1.5) * rage(w);
        if (!p.bn.base && !q.bn.base) { p.bn.dur -= q.bn.t.brk * k * B.pw; q.bn.dur -= p.bn.t.brk * k * A.pw; }   // 体の芯の背骨は折れないし、当たった骨も傷めない
        p.bn.cd = q.bn.cd = 0.15;
        w.ev.push({ k: 'clack', x: cx, y: cy, v: vn });
        if (p.bn.dur <= 0) breakBone(w, A, p.bn);
        if (q.bn.dur <= 0) breakBone(w, B, q.bn);
      }
    }
  }
  function closestPt(pt, st) {    // 点から線分へ、いちばん近い所（0〜1）
    const ux = st.b.x - st.a.x, uy = st.b.y - st.a.y, L2 = ux * ux + uy * uy;
    return L2 < 1e-9 ? 0 : clamp(((pt.x - st.a.x) * ux + (pt.y - st.a.y) * uy) / L2, 0, 1);
  }
  function strike(w, def, att, bn, vn, along, x, y, nx, ny) {   // 相手の骨がドクロに当たった
    if (def.inv > 0 || vn < 40) return;
    const t = bn.t;
    let dmg = t.atk * (t.pierce ? clamp(vn / 220, 0.9, 1.5) : clamp(vn / 220, 0.5, 1.8));
    if (along > 0.7) dmg *= 1.2;                     // 骨の先で当てると強い
    hurt(w, def, dmg * att.pw, x, y, nx, ny);
  }
  const rage = w => 1 + clamp((w.t - RAGE_FROM) / RAGE_STEP, 0, RAGE_MAX);
  function hurt(w, c, dmg, x, y, nx, ny) {
    dmg = Math.max(1, Math.round(dmg * rage(w)));
    c.hp = Math.max(0, c.hp - dmg); c.inv = IFRAME; c.flash = 0.25;
    const s = c.pts[0], kb = (70 + dmg * 9) * DT / ((1 + 0.6 * Math.min(2, c.feet)) * c.sc);   // 足が地面についていると、ふっ飛びにくい（体が大きいほど、さらに動かない）
    s.px -= nx * kb; s.py -= ny * kb * 0.6;
    w.ev.push({ k: 'hit', x, y, dmg, side: c.dir });
  }

  /* ---------- 世界を1コマ進める ---------- */
  function stepWorld(w) {
    const A = w.A, B = w.B;
    for (let k = 0; k < SUB; k++) {
      w.clock += DT;
      integrate(w, A, B); integrate(w, B, A);
      muscles(w, A); muscles(w, B);
      constraints(A); constraints(B);
      collide(w, A, B);
      for (const c of [A, B]) { if (c.inv > 0) c.inv -= DT; if (c.flash > 0) c.flash -= DT; for (const bn of c.bones) if (bn.cd > 0) bn.cd -= DT; }
    }
    for (const d of w.debris) {
      d.t += 1 / 60; d.vy += GRAV / 60; const mx = d.vx / 60, my = d.vy / 60; d.x1 += mx; d.x2 += mx; d.y1 += my; d.y2 += my;
      const cx = (d.x1 + d.x2) / 2, cy = (d.y1 + d.y2) / 2, a = d.w / 60, cs = Math.cos(a), sn = Math.sin(a);

/* ---------- ごほうび（相手の骨をもらう。ふつうは1本、ボスの後は2本） ---------- */

}

  });

/* ---------- 結果（負けた／挑戦の結果） ---------- */

/* 保存・シェア用の画像（1080×1350） */
function renderShare() {
  const cv = document.createElement('canvas'); cv.width = 1080; cv.height = 1350; const c = cv.getContext('2d');
  c.save(); c.scale(3, 3); const g = c.createLinearGradient(0, 0, 0, 450); g.addColorStop(0, PAL.bg0); g.addColorStop(1, PAL.bg1); c.fillStyle = g; c.fillRect(0, 0, 360, 450);
  const r = SIM.rng(5); c.fillStyle = '#fff'; for (let i = 0; i < 40; i++) { c.globalAlpha = 0.2 + r() * 0.5; c.fillRect(r() * 360, r() * 450, 1.4, 1.4); } c.globalAlpha = 1;
  c.fillStyle = PAL.ground; c.fillRect(0, 372, 360, 78); c.fillStyle = '#4a3f7d'; c.fillRect(0, 372, 360, 4);
  text(c, GAME_TITLE, 183, 53, 44, PAL.ink, { title: true, w: 400 }); text(c, GAME_TITLE, 180, 50, 44, PAL.bone, { title: true, w: 400, stroke: PAL.ink, sw: 7 });
  const head = G.mode === 'challenge' ? (G.result === 'A' ? '挑戦に 勝った！' : '挑戦に 負けた…') : `${G.wins}連勝！`;

  const b = boundsOf(G.build), k = Math.min(1.5, 300 / (b.x1 - b.x0), 220 / (b.y1 - b.y0)); c.save(); c.translate(180, 250); c.scale(k, k); drawPose(c, poseOf(G.build, -(b.x0 + b.x1) / 2, -(b.y0 + b.y1) / 2, 1, 0, 0), 1); c.restore();

}
function makeShareBlob() {
  G.shareBlob = null; const res = G.t0;
  try {
    const cv = renderShare(), set = b => { if (b && G.t0 === res && !G.shareBlob) G.shareBlob = b; };
    if (cv.toBlob) cv.toBlob(set, 'image/png');
    setTimeout(() => { if (G.t0 !== res || G.shareBlob) return; try { const u = cv.toDataURL('image/png'), bin = atob(u.split(',')[1]), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i); set(new Blob([arr], { type: 'image/png' })); } catch (e) { /* 無視 */ } }, 1100);
  } catch (e) { /* 画像が作れなくても遊びは続く */ }
}
let dlPromise = null;
function getDownloads() { if (!dlPromise) { try { dlPromise = (window.claude && typeof window.claude.use === 'function') ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null); } catch (e) { dlPromise = Promise.resolve(null); } } return dlPromise; }

  try { const url = URL.createObjectURL(G.shareBlob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); toast('画像を保存しました'); } catch (e) { toast('この環境では保存できませんでした'); }
}
function doShare() {
  const link = shareLink(), u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(shareMsg()) + (link ? '&url=' + encodeURIComponent(link) : '');
  try { const w = window.open(u, '_blank', 'noopener'); if (!w && !link) toast('この環境では開けませんでした'); } catch (e) { toast('この環境では開けませんでした'); }

}

  try { await navigator.clipboard.writeText(link); toast('挑戦状のリンクをコピーしました'); } catch (e) { toast('コピーできませんでした'); }
}

/* ============================================================
   入力・メインループ
   ============================================================ */
function toLocal(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function onDown(e) {
  if (e.preventDefault) e.preventDefault(); audioInit();
  const [x, y] = toLocal(e);
  if (G.screen === 'build' && buildDown(x, y)) { try { canvas.setPointerCapture(e.pointerId); } catch (er) { /* 無視 */ } return; }
  if (G.screen === 'battle' && G.phase === 'end' && G.endT > 1.2) { afterBattle(); return; }
  for (let i = UI.length - 1; i >= 0; i--) { const b = UI[i]; if (b.enabled && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { G.press = { id: b.id, t: T() }; sfx.ui(); b.fn(); return; } }
}
function onMove(e) { if (G.screen === 'build' && G.drag) { if (e.preventDefault) e.preventDefault(); const [x, y] = toLocal(e); buildMove(x, y); } }
function onUp(e) { if (G.screen === 'build' && G.drag) { const [x, y] = toLocal(e); G.drag.x = x; G.drag.y = y; buildMove(x, y); buildUp(); } }

let acc = 0, lastT = T();
function frame() {
  requestAnimationFrame(frame);
  const now = T(); acc += Math.min(0.1, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1 / 60 && n < 4) { acc -= 1 / 60; n++; G.frame = (G.frame | 0) + 1; if (G.screen === 'battle') battleStep(); else if (G.screen === 'title') demoStep(); else if (G.screen === 'build') camStep(); if (G.shake > 0) G.shake = Math.max(0, G.shake - 1 / 60 * 2.2); }
  if (n === 4) acc = 0;
  render(now);
}
function render(now) {
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0); UI = [];
  if (G.screen === 'title') drawTitle(now); else if (G.screen === 'how') drawHow(now); else if (G.screen === 'build') { drawBuild(now); drawFx(now); }
  else if (G.screen === 'battle') drawBattle(now); else if (G.screen === 'reward') drawReward(now); else drawOver(now);
  drawToast(now);
}
function resize() {
  let vw = window.innerWidth, vh = window.innerHeight;
  try { const r = document.getElementById('app').getBoundingClientRect(); if (r.width > 0 && r.height > 0) { vw = r.width; vh = r.height; } } catch (e) { /* 無視 */ }
  const k = Math.min(vw / W, vh / H), cw = Math.max(1, Math.floor(W * k)), chh = Math.max(1, Math.floor(H * k)), dpr = Math.min(window.devicePixelRatio || 1, 3);
  canvas.style.width = cw + 'px'; canvas.style.height = chh + 'px'; canvas.width = Math.floor(cw * dpr); canvas.height = Math.floor(chh * dpr);
}
function readChallenge() { try { const m = /[#&]c=([0-9A-Za-z]+)/.exec(location.hash || ''); const b = m ? decodeBuild(m[1]) : null; G.challenge = b && nBones(b) > 0 ? b : null; } catch (e) { G.challenge = null; } }
function init() {
  readChallenge(); resize(); window.addEventListener('resize', resize); window.addEventListener('hashchange', () => { readChallenge(); G.screen = 'title'; });
  canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); canvas.addEventListener('pointerup', onUp); canvas.addEventListener('pointercancel', () => { G.drag = null; });
  canvas.addEventListener('wheel', e => { if (G.screen !== 'build') return; e.preventDefault(); G.camY = G.camTo = camClamp(G.camY + e.deltaY * 0.6); }, { passive: false });   // パソコンでは マウスのホイールでも上下に動かせる
  canvas.addEventListener('contextmenu', e => e.preventDefault()); getDownloads();
  try { if (document.fonts && document.fonts.load) document.fonts.load('40px "Dela Gothic One"', GAME_TITLE + 'あそびかた連勝！挑戦に勝った負け…引き分けファイト第戦状ボス0123456789').catch(() => {}); } catch (e) { /* 無視 */ }
  requestAnimationFrame(frame);
}
window.__hn = { G, SIM, ROSTER, enemyFor, isBossRound, encodeBuild, decodeBuild, poseOf, buildPose, jointsOf, startBattle, newRun, gotoBuild, takeReward, pickReward, afterBattle, startChallenge, newBuild, nBones, camRange, fitCam, buildExtent, PALX, PALY, SLOT, BX, BY, VIEW_TOP, VIEW_BOT, TY_ORDER };
init();
</script>
